{% load static %}

<link rel="stylesheet" href="{% static 'lab/css/code_editor.css' %}">

<section class="code-editor-card">

    <!-- HEADER -->
    <div class="code-editor-header">

        <div class="code-editor-title">

            <span class="code-editor-icon">💻</span>

            <div>
                <h2>Code Editor</h2>
                <p>Write and run your program in the Virtual Lab.</p>
            </div>

        </div>

        <select
            class="language-select"
            id="languageSelect"
        >
            <option value="c">C</option>
            <option value="cpp">C++</option>
            <option value="java">Java</option>
            <option value="python">Python</option>
        </select>

    </div>


    <!-- CODE AREA -->
    <div class="editor-wrapper">

        <div
            class="line-numbers"
            id="lineNumbers"
        ></div>

        <textarea
            class="code-textarea"
            id="codeTextarea"
            spellcheck="false"
            placeholder="Write your code here..."
        ></textarea>

    </div>


    <!-- ACTION BUTTONS -->
    <div class="editor-actions">

        <button
            class="run-code-btn"
            id="runCodeBtn"
            type="button"
        >
            ▶ Run Code
        </button>

        <button
            class="clear-code-btn"
            id="clearCodeBtn"
            type="button"
        >
            Clear
        </button>

    </div>


    <!-- OUTPUT -->
    <div class="output-section">

        <div class="output-header">
            <strong>Output</strong>
        </div>

        <div
            class="terminal-container"
            id="terminalContainer"
        >

            <pre
                class="output-box"
                id="outputBox"
            >Output will appear here...</pre>

        </div>

    </div>

</section>


<script src="{% static 'lab/js/code_editor.js' %}"></script>
